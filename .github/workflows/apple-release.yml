name: Apple Release

on:
  workflow_call:
    inputs:
      runs_on:
        description: "runner 标签;默认 xcode-27(含 Xcode 27)"
        type: string
        required: false
        default: xcode-27
      kit_ref:
        description: "EasyRelease 的 ref(tag / SHA);生产建议 pin SHA"
        type: string
        required: false
        default: apple-v0
      checkout_ref:
        description: "检出业务仓库的 ref;留空用事件 ref"
        type: string
        required: false
        default: ""
      app:
        description: "应用名,用于 artifact 命名与默认路径"
        type: string
        required: true
      bundle_id:
        description: "Bundle ID;可留空,由 Info.plist 推断"
        type: string
        required: false
        default: ""
      identity:
        description: "完整签名身份;留空按 team_id 查找"
        type: string
        required: false
        default: ""
      notary_auth:
        description: "公证认证:auto / api-key / apple-id"
        type: string
        required: false
        default: auto
      apple_id:
        description: "Apple ID(仅 apple-id 认证)"
        type: string
        required: false
        default: ""
      artifact:
        description: "产物路径;留空则用 apps/<app>/.build/bundle/<app>.app"
        type: string
        required: false
        default: ""
      build_command:
        description: "构建命令;留空表示产物已存在"
        type: string
        required: false
        default: ""
      mode:
        description: "adhoc 或 developer-id"
        type: string
        required: false
        default: adhoc
      notarize:
        description: "是否公证(仅 developer-id)"
        type: boolean
        required: false
        default: false
      staple:
        description: "公证后是否 staple"
        type: boolean
        required: false
        default: true
      dry_run:
        description: "只校验输入并产出 manifest"
        type: boolean
        required: false
        default: false
      upload_artifact:
        description: "是否上传产物与 manifest"
        type: boolean
        required: false
        default: true
      release:
        description: "是否创建 GitHub Release"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag(必须已存在)"
        type: string
        required: false
        default: ""
      release_files:
        description: "额外发布文件,每行一个 glob;留空则用产物 + manifest"
        type: string
        required: false
        default: ""
    # 名称与 EasyIndie 组织 secret 完全一致,调用方可直接 secrets: inherit。
    secrets:
      APPLE_CERTIFICATE_P12_BASE64:
        required: false
      APPLE_CERTIFICATE_P12_PASSWORD:
        required: false
      APPLE_ASC_API_KEY_ID:
        required: false
      APPLE_ASC_ISSUER_ID:
        required: false
      APPLE_ASC_API_KEY:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      # 可选:组织的 Team ID / 自定义 keychain 密码
      APPLE_TEAM_ID:
        required: false
      APPLE_KEYCHAIN_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 检出业务仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: 检出 EasyRelease
        uses: actions/checkout@v4
        with:
          repository: EasyIndie/EasyRelease
          ref: ${{ inputs.kit_ref }}
          path: .easyrelease
          persist-credentials: false

      - name: 构建
        if: inputs.build_command != ''
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: bash -c "$BUILD_COMMAND"

      - name: 解析产物路径
        id: resolve
        env:
          ARTIFACT: ${{ inputs.artifact }}
          APP: ${{ inputs.app }}
        run: |
          if [ -n "$ARTIFACT" ]; then
            printf 'artifact=%s\n' "$ARTIFACT" >> "$GITHUB_OUTPUT"
          else
            printf 'artifact=apps/%s/.build/bundle/%s.app\n' "$APP" "$APP" >> "$GITHUB_OUTPUT"
          fi

      - name: 签名 / 公证 / 校验
        id: sign
        uses: ./.easyrelease/apple
        with:
          artifact: ${{ steps.resolve.outputs.artifact }}
          mode: ${{ inputs.mode }}
          notarize: ${{ inputs.notarize }}
          staple: ${{ inputs.staple }}
          dry_run: ${{ inputs.dry_run }}
          bundle_id: ${{ inputs.bundle_id }}
          p12_base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          p12_password: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          team_id: ${{ secrets.APPLE_TEAM_ID }}
          identity: ${{ inputs.identity }}
          keychain_password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          notary_auth: ${{ inputs.notary_auth }}
          apple_id: ${{ inputs.apple_id || secrets.APPLE_ID }}
          apple_password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          asc_key_id: ${{ secrets.APPLE_ASC_API_KEY_ID }}
          asc_issuer_id: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          asc_key_p8: ${{ secrets.APPLE_ASC_API_KEY }}

      - name: 整理上传目录(扁平结构)
        if: inputs.upload_artifact
        env:
          ARTIFACT: ${{ steps.resolve.outputs.artifact }}
          MANIFEST: ${{ steps.sign.outputs.manifest_path }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/easyrelease-upload"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto "$ARTIFACT" "$stage/$(basename "$ARTIFACT")"
          cp "$MANIFEST" "$stage/apple-manifest.json"

      - name: 上传产物与 manifest
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyrelease-${{ inputs.app }}
          path: ${{ runner.temp }}/easyrelease-upload
          if-no-files-found: error

      - name: 打包发布物(下游 zip / 原生)
        if: inputs.release
        env:
          ARTIFACT: ${{ steps.sign.outputs.signed_artifact }}
          MANIFEST: ${{ steps.sign.outputs.manifest_path }}
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          [ -n "$TAG" ] || { echo "::error::release=true 时 release_tag 不能为空"; exit 1; }
          out="$RUNNER_TEMP/easyrelease-release"
          rm -rf "$out"
          mkdir -p "$out"
          files=()

          case "$ARTIFACT" in
            *.zip)
              cp "$ARTIFACT" "$out/$APP-$TAG.zip"
              files=("$out/$APP-$TAG.zip")
              ;;
            *.app)
              stage="$out/stage"
              mkdir -p "$stage"
              ditto "$ARTIFACT" "$stage/$APP.app"
              cp "$MANIFEST" "$stage/apple-manifest.json"
              ditto -c -k "$stage" "$out/$APP-$TAG.zip"
              files=("$out/$APP-$TAG.zip")
              ;;
            *.dmg)
              cp "$ARTIFACT" "$out/$APP-$TAG.dmg"
              files=("$out/$APP-$TAG.dmg")
              ;;
            *.pkg)
              cp "$ARTIFACT" "$out/$APP-$TAG.pkg"
              files=("$out/$APP-$TAG.pkg")
              ;;
            *)
              echo "::error::不支持的发布产物:$ARTIFACT"
              exit 1
              ;;
          esac

          cp "$MANIFEST" "$out/$APP-$TAG-manifest.json"
          files+=("$out/$APP-$TAG-manifest.json")
          for f in "${files[@]}"; do
            filename="$(basename "$f")"
            (cd "$out" && shasum -a 256 "$filename" > "$filename.sha256")
            printf '%s\n' "$out/$filename" "$out/$filename.sha256" >> "$out/release-files.txt"
          done
          cat "$out/release-files.txt"

      - name: 创建 GitHub Release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FILES: ${{ inputs.release_files }}
          PACKAGED_FILES: ${{ runner.temp }}/easyrelease-release/release-files.txt
          FALLBACK_ARTIFACT: ${{ steps.sign.outputs.signed_artifact }}
          MANIFEST: ${{ steps.sign.outputs.manifest_path }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "::error::release=true 时 release_tag 不能为空"; exit 1; }

          files=()
          if [ -n "$FILES" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              # 允许 glob;由 shell 展开
              for f in $line; do
                [ -e "$f" ] && files+=("$f")
              done
            done <<< "$FILES"
          elif [ -f "$PACKAGED_FILES" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && files+=("$f")
            done < "$PACKAGED_FILES"
          else
            files=("$FALLBACK_ARTIFACT" "$MANIFEST")
          fi

          [ ${#files[@]} -gt 0 ] || { echo "::error::没有可发布文件"; exit 1; }
          gh release create "$TAG" "${files[@]}" --verify-tag --generate-notes

