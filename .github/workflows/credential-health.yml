name: Credential Health

on:
  schedule:
    # 每月 1 日 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      threshold_days:
        description: "剩余天数阈值"
        type: number
        default: 30

permissions:
  contents: read
  issues: write

concurrency:
  group: credential-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 检查证书到期
        id: health
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          APPLE_INSTALLER_P12_BASE64: ${{ secrets.APPLE_INSTALLER_P12_BASE64 }}
          APPLE_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
          THRESHOLD_DAYS: ${{ inputs.threshold_days || 30 }}
        run: bash scripts/credential-health.sh

      - name: 开/更新提醒 issue
        if: steps.health.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_DAYS: ${{ inputs.threshold_days || 30 }}
        run: |
          set -euo pipefail
          body="$(cat "$RUNNER_TEMP/credential-health-alert.md")"
          existing="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'in:title "[credential-health]"' \
            --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "[credential-health] 证书到期提醒" \
              --body "$body"
          fi

      - name: 证书已过期则红灯
        if: steps.health.outputs.expired == 'true'
        run: |
          echo "::error::存在已过期证书,请立即轮换(见 docs/credentials.md)"
          exit 1
